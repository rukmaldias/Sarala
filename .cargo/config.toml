# Sarala builds for aarch64 musl. Static linking keeps the initramfs a single
# binary with no loader and no libc to ship alongside it.
[build]
target = "aarch64-unknown-linux-musl"

[target.aarch64-unknown-linux-musl]
# Link with the aarch64 cross-gcc as the driver. Without an explicit linker
# cargo falls back to the host cc, which invokes the host x86_64 ld and fails
# on aarch64 objects with "Relocations in generic ELF (EM: 183)".
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-feature=+crt-static"]
